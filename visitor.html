<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Visitor Counter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .counter-card {
            max-width: 420px;
            margin: 15vh auto;
            background: #fff;
            border-radius: 18px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,.15);
        }
        .counter-card i {
            font-size: 48px;
            color: #007bff;
        }
        .counter-card h1 {
            font-size: 56px;
            margin: 20px 0 5px;
        }
        .counter-card p {
            color: #666;
            font-size: 16px;
        }
      
            .login-box {
          max-width: 320px;
          margin: 20vh auto;
          background: #fff;
          padding: 30px;
          border-radius: 16px;
          box-shadow: 0 15px 40px rgba(0,0,0,.15);
          text-align: center;
      }

      .login-box input {
          width: 100%;
          padding: 12px;
          margin: 15px 0;
          border-radius: 8px;
          border: 1px solid #ccc;
      }

      .login-box button {
          width: 100%;
          padding: 10px;
          background: #007bff;
          color: #fff;
          border: none;
          border-radius: 8px;
      }

      #pinError {
          color: red;
          margin-top: 10px;
      }

    </style>
</head>
<body>

<div id="loginBox" class="login-box">
    <h4>Admin Access</h4>
    <input type="password" id="pinInput" placeholder="Masukkan PIN">
    <button onclick="checkPin()">Masuk</button>
    <p id="pinError"></p>
</div>

  
<div id="dashboard" style="display:none">
    <div class="counter-card">
        <h2 id="totalVisitor">0</h2>
        <p>Total Pengunjung</p>
    </div>

    <div class="counter-card">
        <h2 id="monthVisitor">0</h2>
        <p>Pengunjung Bulan Ini</p>
    </div>
</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7GflfoLPyITY9MMMJ6iTjJp9GGgb12Qk",
  authDomain: "new-cv-a30c0.firebaseapp.com",
  projectId: "new-cv-a30c0",
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const db = firebase.firestore();
const visitorRef = db.collection("stats").doc("visitors");

const now = new Date();
const monthKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");

visitorRef.onSnapshot(doc => {
    if (!doc.exists) return;

    const data = doc.data();

    document.getElementById("totalVisitor").innerText =
        (data.total || 0).toLocaleString();

    const monthCount =
        (data.month && data.month[monthKey]) ? data.month[monthKey] : 0;

    document.getElementById("monthVisitor").innerText =
        monthCount.toLocaleString();
});
function animateCount(target) {
    const el = document.getElementById("visitorCount");
    let start = 0;
    const step = Math.ceil(target / 60);

    const timer = setInterval(() => {
        start += step;
        if (start >= target) {
            el.innerText = target.toLocaleString();
            clearInterval(timer);
        } else {
            el.innerText = start.toLocaleString();
        }
    }, 16);
}
</script>
  
  <script>
const ADMIN_PIN = "081892"; // ganti PIN kamu

function checkPin() {
    const pin = document.getElementById("pinInput").value;

    if (pin === ADMIN_PIN) {
        sessionStorage.setItem("admin", "true");
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
    } else {
        document.getElementById("pinError").innerText = "PIN salah!";
    }
}

if (sessionStorage.getItem("admin") === "true") {
    window.onload = () => {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
    }
}
</script>


</body>
</html>
